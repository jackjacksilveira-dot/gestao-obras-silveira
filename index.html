<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Obras Silveira</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Gestão de Obras Silveira</h1><p>Controle de serviços e obras</p></header><nav><button onclick="show('painel')">Painel</button><button onclick="show('obras')">Obras</button><button onclick="show('clientes')">Clientes</button><button onclick="show('financeiro')">Financeiro</button></nav><main><section id="painel"><div class="cards"><article>Em execução <b id="exec">0</b></article><article>Concluídas <b id="done">0</b></article><article>Contratado <b id="total">R$ 0,00</b></article><article>A receber <b id="due">R$ 0,00</b></article></div><button onclick="newWork()">+ Nova obra</button><div id="recent"></div></section><section id="obras" hidden><h2>Obras</h2><button onclick="newWork()">+ Nova obra</button><div id="works"></div></section><section id="clientes" hidden><h2>Clientes</h2><button onclick="newClient()">+ Novo cliente</button><div id="clients"></div></section><section id="financeiro" hidden><h2>Financeiro</h2><div id="fin"></div></section></main><dialog id="dlg"><button onclick="dlg.close()">Fechar</button><div id="form"></div></dialog><script src="app.js"></script></body></html>
